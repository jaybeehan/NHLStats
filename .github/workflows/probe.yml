name: probe
on: { push: { paths: [".github/workflows/probe.yml"] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "dates=20261021-20261027&limit=100" "dates=20261021-20261027" "week=8&seasontype=2" ""; do
            curl -s -o n.json -w "%{http_code}" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?$q" > code.txt
            echo "::notice::[$q] $(cat code.txt) $(head -c 200 n.json | tr '\n' ' ')"
            python3 -c "import json; d=json.load(open('n.json')); print('::notice::[$q] week', d.get('week'), 'n', len(d.get('events',[])), sorted({e['date'][:10] for e in d.get('events',[])}))" || true
          done
