name: probe
on: { push: { paths: [".github/workflows/probe.yml"] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          def ht(key, client, params):
              q = dict(params, key=key, client_code=client, fmt="json", lang="en")
              t = urllib.request.urlopen("https://lscluster.hockeytech.com/feed/index.php?" + urllib.parse.urlencode(q), timeout=60).read().decode().strip()
              if t.startswith("(") and t.endswith(")"): t = t[1:-1]
              return json.loads(t)
          for lg, key, client, sid in [("AHL","50c2cd9b5e18e390","ahl",94),("ECHL","2c2b89ea7345cae8","echl",78)]:
              p = ht(key, client, {"feed":"statviewfeed","view":"players","season":sid,"team":"all","position":"skaters","statsType":"standard","limit":2000,"first":0,"sort":"points","qualified":"all","rookies":0,"division":-1})
              first = p[0] if isinstance(p, list) else p
              rows = [d["row"] for s in first.get("sections", []) for d in s.get("data", [])]
              print(f"::notice::{lg} skaters {len(rows)}; keys {sorted(rows[0].keys()) if rows else None}")
              if rows: print(f"::notice::{lg} first {json.dumps(rows[0])[:900]}")
              props = [d.get("prop") for s in first.get("sections", []) for d in s.get("data", [])][:1]
              print(f"::notice::{lg} prop {json.dumps(props)[:400]}")
          PY
