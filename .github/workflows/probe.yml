name: probe
on: { push: { paths: [".github/workflows/probe.yml"] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "racing/f1/scoreboard" "racing/f1/scoreboard?dates=20261024" "football/nfl/scoreboard?dates=20261025" "baseball/mlb/scoreboard?dates=20261024" "basketball/nba/scoreboard?dates=20261024"; do
            h=$(curl -s -D - -o /dev/null -H "Origin: https://jaybeehan.github.io" "https://site.api.espn.com/apis/site/v2/sports/$u" | tr -d '\r' | grep -i "^access-control-allow-origin" ); echo "::notice::$u $h"
          done
          curl -s "https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard" > f1.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard?dates=20261024" > f1b.json
          python3 - <<'PY'
          import json
          for fn in ["f1.json","f1b.json"]:
              d = json.load(open(fn))
              print("::notice::", fn, "keys", list(d.keys()), "events", len(d.get("events", [])))
              for ev in d.get("events", [])[:2]:
                  print("::notice::EV", ev.get("name"), ev.get("date"), ev.get("status",{}).get("type",{}).get("description"), "comps", len(ev.get("competitions",[])))
                  for c in ev.get("competitions", []):
                      cs = c.get("competitors", [])
                      print("::notice::C", json.dumps({k: c.get(k) for k in ("date","type","status")})[:400], "n", len(cs), json.dumps(cs[0])[:500] if cs else "")
          PY
