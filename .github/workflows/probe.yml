name: probe
on: { push: { paths: [".github/workflows/probe.yml"] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="NHLStats site builder (github.com/jaybeehan/NHLStats)"
          curl -s -A "$UA" https://moneypuck.com/moneypuck/playerData/careers/gameByGame/regular/goalies/8482221.csv -o l.csv
          echo "::notice::levi seasons $(cut -d, -f2 l.csv | sort | uniq -c | tr '\n' ' ') last dates $(cut -d, -f8 l.csv | sort | tail -3 | tr '\n' ' ')"
          curl -s https://jaybeehan.github.io/NHLStats/data/20262027/goalies.json | python3 -c "
          import sys,json,urllib.request,time
          ids=sorted({r[0] for r in json.load(sys.stdin)['rows']})
          bad=[]
          for i in ids:
              try: urllib.request.urlopen(urllib.request.Request(f'https://moneypuck.com/moneypuck/playerData/careers/gameByGame/regular/goalies/{i}.csv',headers={'User-Agent':'x'}),timeout=60).read()
              except Exception as e: bad.append((i,str(e)))
              time.sleep(0.3)
          print('::notice::bad', bad)"
