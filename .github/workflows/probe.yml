name: probe
on: { push: { paths: [".github/workflows/probe.yml"] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://jaybeehan.github.io/NHLStats/data/20262027/minorgoalies.json > m.json
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          d = json.load(open("m.json"))
          gc = d["goalies"]["cols"]; print("::notice::cols", gc, d["games"]["cols"])
          for r in d["goalies"]["rows"]:
              if r[3] in ("BAK", "FW"): print("::notice::G", r)
          for r in d["games"]["rows"]:
              if r[4] in ("BAK", "FW"): print("::notice::GM", r)
          bad = [r for r in d["goalies"]["rows"] if r[6] and not r[7]]
          print("::notice::sv0 count", len(bad), bad[:3])
          def ht(key, client, params):
              q = dict(params, key=key, client_code=client, fmt="json", lang="en")
              t = urllib.request.urlopen("https://lscluster.hockeytech.com/feed/index.php?" + urllib.parse.urlencode(q), timeout=60).read().decode().strip()
              if t.startswith("(") and t.endswith(")"): t = t[1:-1]
              return json.loads(t)
          for lg, key, client, sid in [("AHL","50c2cd9b5e18e390","ahl",94),("ECHL","2c2b89ea7345cae8","echl",78)]:
              p = ht(key, client, {"feed":"statviewfeed","view":"players","season":sid,"team":"all","position":"goalies","statsType":"standard","limit":1000,"first":0,"sort":"gaa","qualified":"all","rookies":0,"division":-1})
              first = p[0] if isinstance(p, list) else p
              rows = [d["row"] for s in first.get("sections", []) for d in s.get("data", [])]
              for r in rows:
                  if r.get("team_code") in ("BAK","FW"): print(f"::notice::RAW {lg} {json.dumps(r)}")
          PY
